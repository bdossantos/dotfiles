# Runtimes required for the Neovim setup
# https://mise.jdx.dev/configuration.html

# Per-cask `appdir` needs 2026.10.0 and `[bootstrap.settings.macos]` needs
# 2026.11.8 (older releases silently ignore it)
min_version = "2026.11.8"

[settings]
idiomatic_version_file_enable_tools = ["ruby", "python", "node", "go", "rust"]

[tools]
node = "26"
lua = "5.4"
python = "3.14"
ruby = "3.4"
go = "1.27"
rust = "1.100"
