# User-level macOS defaults (replaces the former .macos and .macos_hardening
# scripts)
# https://mise.jdx.dev/bootstrap/macos-defaults.html
#
# Apply with `mise bootstrap macos defaults apply` (add `--dry-run` to preview).
# Dock, Finder and the menu bar only read their preferences when they start:
# restart them (or log out) to see the changes.
# Common Dock, Finder and keyboard settings use mise's named keys, everything
# else is set by domain and key.

[bootstrap.settings.macos.dock]
# Keep the Dock on the left edge of the screen
orientation = "left"
# Automatically hide and show the Dock, without delay nor animation
autohide = true
autohide_delay = 0.0
autohide_time_modifier = 0.0
# Set the icon size of Dock items to 36 pixels
tilesize = 36
# Don’t show recent applications in Dock
show_recents = false
# Don’t automatically rearrange Spaces based on most recent use
mru_spaces = false

[bootstrap.settings.macos.finder]
# Expose hidden files in Finder
show_all_files = true
show_status_bar = true
show_pathbar = true
# Keep folders on top when sorting by name
sort_folders_first = true
# Disable the warning when changing a file extension
show_extensions_warning = false
# Use list view in all Finder windows by default
preferred_view_style = "list"
# Save to disk (not to iCloud) by default
save_new_documents_to_cloud = false

[bootstrap.settings.macos.keyboard]
# Set a blazingly fast keyboard repeat rate
key_repeat = 1
initial_key_repeat = 10
# Disable press-and-hold for keys in favor of key repeat
press_and_hold = false
# Disable automatic capitalization and auto-correct, annoying when typing code
automatic_capitalization = false
automatic_spelling_correction = false

[bootstrap.settings.macos.trackpad]
# Keep three-finger drag off
three_finger_drag = false

# Keep tap-to-click off (physical click only). Not the named `tap_to_click`
# key: macOS stores `Clicking` as an integer and coerces it back after every
# write, so a boolean would show up as permanent drift in `make macos-status`.
[bootstrap.settings.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = 0

[bootstrap.settings.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = 0

[bootstrap.settings.macos.defaults.NSGlobalDomain]
# Set highlight color to green
AppleHighlightColor = "0.764700 0.976500 0.568600"
# Set sidebar icon size to medium
NSTableViewDefaultSizeMode = 2
# Always show scrollbars
AppleShowScrollBars = "Always"
# Disable the over-the-top focus ring animation
NSUseAnimatedFocusRing = false
# Adjust toolbar title rollover delay
NSToolbarTitleViewRolloverDelay = 0.0
# Increase window resize speed for Cocoa applications
NSWindowResizeTime = 0.001
# Expand save panel by default
NSNavPanelExpandedStateForSaveMode = true
NSNavPanelExpandedStateForSaveMode2 = true
# Expand print panel by default
PMPrintingExpandedStateForPrint = true
PMPrintingExpandedStateForPrint2 = true
# Display ASCII control characters using caret notation in standard text views
# Try e.g. `cd /tmp; unidecode "\x{0000}" > cc.txt; open -e cc.txt`
NSTextShowsControlCharacters = true
# Disable automatic termination of inactive apps
NSDisableAutomaticTermination = true
# Disable smart dashes as they’re annoying when typing code
NSAutomaticDashSubstitutionEnabled = false
# Disable automatic period substitution as it’s annoying when typing code
NSAutomaticPeriodSubstitutionEnabled = false
# Disable smart quotes as they’re annoying when typing code
NSAutomaticQuoteSubstitutionEnabled = false
# Disable inline text prediction (macOS 14+), annoying when typing code
NSAutomaticInlinePredictionEnabled = false
# Disable window open/close animations
NSAutomaticWindowAnimationsEnabled = false
# Disable “natural” (Lion-style) scrolling
"com.apple.swipescrolldirection" = false
# Enable full keyboard access for all controls
# (e.g. enable Tab in modal dialogs)
AppleKeyboardUIMode = 3
# Set language and text formats
# Note: if you’re in the US, replace `EUR` with `USD`, `Centimeters` with
# `Inches`, `en_GB` with `en_US`, and `true` with `false`.
AppleLanguages = ["en", "fr"]
AppleLocale = "en_US@currency=EUR"
AppleMeasurementUnits = "Centimeters"
AppleMetricUnits = true
# Tweak for having a nice font rendering in terminal emulators
AppleFontSmoothing = 0
# Finder: show all filename extensions
AppleShowAllExtensions = true
# Enable spring loading for directories
"com.apple.springing.enabled" = true
# Remove the spring loading delay for directories
"com.apple.springing.delay" = 0.0
# Add a context menu item for showing the Web Inspector in web views
WebKitDeveloperExtras = true

[bootstrap.settings.macos.defaults."com.apple.print.PrintingPrefs"]
# Automatically quit printer app once the print jobs complete
"Quit When Finished" = true

[bootstrap.settings.macos.defaults."com.apple.LaunchServices"]
# Keep the “Are you sure you want to open this application?” dialog for
# downloaded apps (Apple’s default; it used to be disabled here)
LSQuarantine = true

[bootstrap.settings.macos.defaults."com.apple.helpviewer"]
# Set Help Viewer windows to non-floating mode
DevMode = true

[bootstrap.settings.macos.defaults."com.apple.BluetoothAudioAgent"]
# Increase sound quality for Bluetooth headphones/headsets
"Apple Bitpool Min (editable)" = 40

[bootstrap.settings.macos.defaults."com.apple.screensaver"]
# Require password immediately after sleep or screen saver begins
askForPassword = 1
askForPasswordDelay = 0

[bootstrap.settings.macos.defaults."com.apple.screencapture"]
# Save screenshots in PNG format (other options: BMP, GIF, JPG, PDF, TIFF)
type = "png"
# Disable shadow in screenshots
disable-shadow = true
# Write screenshots right away, without the floating thumbnail preview
show-thumbnail = false

[bootstrap.settings.macos.defaults."com.apple.finder"]
# Finder: allow quitting via ⌘ + Q; doing so will also hide desktop icons
QuitMenuItem = true
DisableAllAnimations = true
# Set Desktop as the default location for new Finder windows
# For other paths, use `PfLo` and `file:///full/path/here/`
NewWindowTarget = "PfDe"
# Show icons for hard drives, servers, and removable media on the desktop
ShowExternalHardDrivesOnDesktop = true
ShowHardDrivesOnDesktop = true
ShowMountedServersOnDesktop = true
ShowRemovableMediaOnDesktop = true
# Display full POSIX path as Finder window title
_FXShowPosixPathInTitle = true
# When performing a search, search the current folder by default
FXDefaultSearchScope = "SCcf"
OpenWindowForNewRemovableDisk = true
# Disable the warning before emptying the Trash
WarnOnEmptyTrash = false
# Automatically remove items from the Trash after 30 days
FXRemoveOldTrashItems = true
# Expand the following File Info panes:
# “General”, “Open with”, and “Sharing & Permissions”
FXInfoPanesExpanded = { "General" = true, "OpenWith" = true, "Privileges" = true }

[bootstrap.settings.macos.defaults."com.apple.desktopservices"]
# Avoid creating .DS_Store files on network or USB volumes
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

[bootstrap.settings.macos.defaults."com.apple.frameworks.diskimages"]
# Keep verifying disk image checksums (Apple’s default; it used to be skipped)
skip-verify = false
skip-verify-locked = false
skip-verify-remote = false
# Automatically open a new Finder window when a volume is mounted
auto-open-ro-root = true
auto-open-rw-root = true

[bootstrap.settings.macos.defaults."com.apple.dock"]
# Enable highlight hover effect for the grid view of a stack (Dock)
mouse-over-hilite-stack = true
# Change minimize/maximize window effect
mineffect = "scale"
# Minimize windows into their application’s icon
minimize-to-application = true
# Enable spring loading for all Dock items
enable-spring-load-actions-on-all-items = true
# Show indicator lights for open applications in the Dock
show-process-indicators = true
# Don’t animate opening applications from the Dock
launchanim = false
expose-animation-duration = 0.0
# Don’t group windows by application in Mission Control
# (i.e. use the old Exposé behavior instead)
expose-group-by-app = false
# Make Dock icons of hidden applications translucent
showhidden = true
# Hot corners
# Possible values:
#  0: no-op
#  2: Mission Control
#  3: Show application windows
#  4: Desktop
#  5: Start screen saver
#  6: Disable screen saver
# 10: Put display to sleep
# 11: Launchpad
# 12: Notification Center
# 13: Lock screen
# Top left screen corner → Mission Control
wvous-tl-corner = 2
wvous-tl-modifier = 0
# Top right screen corner → Desktop
wvous-tr-corner = 4
wvous-tr-modifier = 0
# Bottom left screen corner → Lock screen
wvous-bl-corner = 13
wvous-bl-modifier = 0
# Bottom right screen corner → Start screen saver
wvous-br-corner = 5
wvous-br-modifier = 0
springboard-show-duration = 0.0
springboard-hide-duration = 0.0
springboard-page-duration = 0.0

[bootstrap.settings.macos.defaults."com.apple.TimeMachine"]
# Prevent Time Machine from prompting to use new hard drives as backup volume
DoNotOfferNewDisksForBackup = true

[bootstrap.settings.macos.defaults."com.apple.ActivityMonitor"]
# Show the main window when launching Activity Monitor
OpenMainWindow = true
# Visualize CPU usage in the Activity Monitor Dock icon
IconType = 5
# Show all processes in Activity Monitor
ShowCategory = 0
# Sort Activity Monitor results by CPU usage
SortColumn = "CPUUsage"
SortDirection = 0

[bootstrap.settings.macos.defaults."com.apple.TextEdit"]
# Use plain text mode for new TextEdit documents
RichText = 0
# Open and save files as UTF-8 in TextEdit
PlainTextEncoding = 4
PlainTextEncodingForWrite = 4

[bootstrap.settings.macos.defaults."com.apple.DiskUtility"]
# Enable the debug menu in Disk Utility
DUDebugMenuEnabled = true
advanced-image-options = true

[bootstrap.settings.macos.defaults."com.apple.QuickTimePlayerX"]
# Auto-play videos when opened with QuickTime Player
MGPlayMovieOnOpen = true

# Software Update and App Store auto-update are intentionally not set here:
# their state lives in system-wide domains and is owned by MDM (DDM), the
# user-level keys have no effect.

[bootstrap.settings.macos.defaults."com.google.Chrome"]
# Disable the all too sensitive backswipe on trackpads
AppleEnableSwipeNavigateWithScrolls = false
# Disable the all too sensitive backswipe on Magic Mouse
AppleEnableMouseSwipeNavigateWithScrolls = false
# Expand the print dialog by default
PMPrintingExpandedStateForPrint2 = true

[bootstrap.settings.macos.defaults."com.apple.WindowManager"]
# Window management is handled by Loop: don’t hide windows when clicking the
# wallpaper, and turn off the native edge-drag tiling that fights with it
EnableStandardClickToShowDesktop = false
EnableTilingByEdgeDrag = false
EnableTopTilingByEdgeDrag = false
EnableTilingOptionAccelerator = false
EnableTiledWindowMargins = false

[bootstrap.settings.macos.defaults."com.apple.menuextra.clock"]
# Show the day of the week and AM/PM in the menu bar clock
ShowDayOfWeek = true
ShowAMPM = true
# Show the date only when there is enough room (0: when space allows,
# 1: always, 2: never)
ShowDate = 0

[bootstrap.settings.macos.defaults."com.apple.assistant.support"]
# Disable Siri
"Assistant Enabled" = false

[bootstrap.settings.macos.defaults."com.apple.sharingd"]
# Set AirDrop Discoverability to 'Contacts Only'
DiscoverableMode = "Contacts Only"

# Show item info near icons on the desktop and in other icon views
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.finder"
key = "DesktopViewSettings"
path = ["IconViewSettings", "showItemInfo"]
value = true

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.finder"
key = "FK_StandardViewSettings"
path = ["IconViewSettings", "showItemInfo"]
value = true

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.finder"
key = "StandardViewSettings"
path = ["IconViewSettings", "showItemInfo"]
value = true

# Show item info to the right of the icons on the desktop
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.finder"
key = "DesktopViewSettings"
path = ["IconViewSettings", "labelOnBottom"]
value = false

# Enable snap-to-grid for icons on the desktop and in other icon views
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.finder"
key = "DesktopViewSettings"
path = ["IconViewSettings", "arrangeBy"]
value = "grid"

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.finder"
key = "FK_StandardViewSettings"
path = ["IconViewSettings", "arrangeBy"]
value = "grid"

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.finder"
key = "StandardViewSettings"
path = ["IconViewSettings", "arrangeBy"]
value = "grid"

# Increase grid spacing for icons on the desktop and in other icon views
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.finder"
key = "DesktopViewSettings"
path = ["IconViewSettings", "gridSpacing"]
value = 100.0

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.finder"
key = "FK_StandardViewSettings"
path = ["IconViewSettings", "gridSpacing"]
value = 100.0

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.finder"
key = "StandardViewSettings"
path = ["IconViewSettings", "gridSpacing"]
value = 100.0

# Increase the size of icons on the desktop and in other icon views
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.finder"
key = "DesktopViewSettings"
path = ["IconViewSettings", "iconSize"]
value = 80.0

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.finder"
key = "FK_StandardViewSettings"
path = ["IconViewSettings", "iconSize"]
value = 80.0

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.finder"
key = "StandardViewSettings"
path = ["IconViewSettings", "iconSize"]
value = 80.0

# Prevent Photos from opening automatically when devices are plugged in
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.ImageCapture"
key = "disableHotPlug"
host = "current"
value = true

# Disable automatic emoji substitution (i.e. use plain text smileys)
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.messageshelper.MessageController"
key = "SOInputLineSettings"
path = ["automaticEmojiSubstitutionEnablediMessage"]
value = false

# Disable smart quotes as it’s annoying for messages that contain code
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.messageshelper.MessageController"
key = "SOInputLineSettings"
path = ["automaticQuoteSubstitutionEnabled"]
value = false

# Disable continuous spell checking
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.messageshelper.MessageController"
key = "SOInputLineSettings"
path = ["continuousSpellCheckingEnabled"]
value = false
