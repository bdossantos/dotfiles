# macOS apps and fonts, installed without Homebrew nor sudo
# https://mise.jdx.dev/bootstrap/packages/brew-cask.html
#
#   mise bootstrap packages apply --dry-run
#   mise bootstrap packages apply
#   mise bootstrap packages upgrade
#
# Apps go to ~/Applications (MISE_BREW_CASK_OPT_APPDIR) and mise records them
# in a user-owned prefix (MISE_SYSTEM_BREW_PREFIX), both set in .profile and
# the Makefile. The default prefix, /opt/homebrew, needs sudo to be created.
# Casks that ship a pkg installer or need to live in /Applications cannot be
# installed without admin rights, they are intentionally not listed here.
#
# Command-line tools are in tools.toml. Formulae (`brew:`) are not used: they
# can only be installed in /opt/homebrew.
[bootstrap.packages]
"brew-cask:anki" = { os = "macos" }
"brew-cask:firefox" = { os = "macos" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:google-chrome" = { os = "macos" }
"brew-cask:imageoptim" = { os = "macos" }
"brew-cask:loop" = { os = "macos" }
"brew-cask:micro-snitch" = { os = "macos" }
"brew-cask:podman-desktop" = { os = "macos" }
"brew-cask:slack" = { os = "macos" }
"brew-cask:spotify" = { os = "macos" }
"brew-cask:vlc" = { os = "macos" }

# Fonts
"brew-cask:font-hack" = { os = ["linux", "macos"] }
"brew-cask:font-hack-nerd-font" = { os = ["linux", "macos"] }
"brew-cask:font-jetbrains-mono" = { os = ["linux", "macos"] }
