# Homebrew formulae, apps and fonts (replaces the former .brew script)
# https://mise.jdx.dev/bootstrap/packages/brew.html
# https://mise.jdx.dev/bootstrap/packages/brew-cask.html
#
#   mise bootstrap packages apply --dry-run
#   mise bootstrap packages apply
#   mise bootstrap packages upgrade
#
# Formulae are installed in the standard Homebrew prefix (/opt/homebrew),
# which mise creates with sudo if it does not exist. Apps go to
# ~/Applications (MISE_BREW_CASK_OPT_APPDIR, see .profile).
# Command-line tools that exist in the mise registry are in tools.toml.
[bootstrap.packages]
"brew-cask:anki" = { os = "macos" }
"brew-cask:firefox" = { os = "macos" }
"brew-cask:gcloud-cli" = { os = "macos" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:google-chrome" = { os = "macos" }
"brew-cask:imageoptim" = { os = "macos" }
"brew-cask:iterm2" = { os = "macos" }
"brew-cask:micro-snitch" = { os = "macos" }
"brew-cask:omnigraffle" = { os = "macos" }
"brew-cask:spotify" = { os = "macos" }
"brew-cask:tor-browser" = { os = "macos" }
"brew-cask:vlc" = { os = "macos" }

# Fonts
"brew-cask:font-hack" = { os = ["linux", "macos"] }
"brew-cask:font-hack-nerd-font" = { os = ["linux", "macos"] }
"brew-cask:font-jetbrains-mono" = { os = ["linux", "macos"] }

