# Command-line tools (replaces the former Homebrew formulae)
# https://mise.jdx.dev/registry.html
#
#   mise install
#
# Tools are downloaded in ~/.local/share/mise, no Homebrew nor sudo needed.
# Pin the platforms with `mise lock --platform macos-arm64,linux-x64`.
[tools]
ast-grep = "latest"
aws-cli = "latest"
azure-cli = "latest"
bat = "latest"
bazel = "latest"
cheat = "latest"
direnv = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gcloud = "latest"
gh = "latest"
go-jsonnet = "latest"
hadolint = "latest"
helm = "latest"
jq = "latest"
k9s = "latest"
kops = "latest"
kubectl = "latest"
kubectx = "latest"
azure-kubelogin = "latest"
lazygit = "latest"
miller = "latest"
neovim = "latest"
nomad = "latest"
packer = "latest"
pre-commit = "latest"
prettier = "latest"
ripgrep = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
starship = "latest"
task = "latest"
tealdeer = "latest"
terraform = "latest"
tmux = "latest"
# The pypi: backend installs with uv (pipx otherwise)
uv = "latest"
vale = "latest"
zellij = "latest"
zoxide = "latest"
"aqua:barnybug/cli53" = "latest"
"aqua:grafana/loki/logcli" = "latest"
"npm:diff-so-fancy" = "latest"
"pypi:gitlint-core" = "latest"
"pypi:s3cmd" = "latest"

# GNU userland. uutils ships a single `coreutils` binary (`coreutils date`,
# `coreutils shuf`, ...), so it does not shadow the macOS tools.
# Pinned: the 0.13.0 release ships no macOS binaries, switch back to "latest"
# once upstream publishes them again.
"aqua:uutils/coreutils" = "0.12"

# GNU tools macOS does not ship, or ships in an older BSD flavour, from
# conda-forge (user-space, no conda needed). Those whose commands macOS also
# provides (sed, awk, find, xargs, make) are excluded from the shims in
# config.toml and aliased to their GNU names (gsed, gawk, ...) in .aliases.
"conda:bash" = "latest"
"conda:bash-completion" = "latest"
"conda:findutils" = "latest"
"conda:gawk" = "latest"
"conda:make" = "latest"
"conda:sed" = "latest"
"conda:entr" = "latest"
"conda:moreutils" = "latest"
"conda:pigz" = "latest"
"conda:pv" = "latest"
"conda:the_silver_searcher" = "latest"
"conda:tig" = "latest"
"conda:tree" = "latest"
"conda:watch" = "latest"
"conda:wget" = "latest"
"conda:editorconfig" = "latest"
"conda:universal-ctags" = "latest"
"conda:luarocks" = "latest"
