# Casks installed system-wide in /Applications by the `admin` user.
#
# I use a non privileged user for daily use, so this file is not loaded
# automatically (it is outside of conf.d/). Apply it as admin:
#
#   su admin -c "MISE_GLOBAL_CONFIG_FILE=${HOME}/.dotfiles/.config/mise/system-casks.toml \
#     mise bootstrap packages apply --manager brew-cask"
#
# https://mise.jdx.dev/bootstrap/packages/brew-cask.html
[bootstrap.packages]
"brew-cask:gpg-suite" = { os = "macos", appdir = "/Applications" }
"brew-cask:keybase" = { os = "macos", appdir = "/Applications" }
"brew-cask:vagrant" = { os = "macos", appdir = "/Applications" }
"brew-cask:virtualbox" = { os = "macos", appdir = "/Applications" }
